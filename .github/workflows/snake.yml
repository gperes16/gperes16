name: Gerar animação de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8957e5&color_dots=#ebedf0,#d8c8f7,#b392f0,#8957e5,#6639ba
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a371f7&color_dots=#161b22,#2d1b54,#4c2c8f,#7449cf,#a371f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
